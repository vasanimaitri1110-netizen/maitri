}

.no {

    color: white;

button:hover {
    transform: scale(1.1);
}

.heart {
    position: absolute;
    color: red;
    font-size: 20px;

}

@keyframes float {
    0% { transform: translateY(100vh); opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }

#loveMeter {

    font-size: 1.5rem;
    color: white;
}
</style>
